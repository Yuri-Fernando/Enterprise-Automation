# hosts.example.ini — inventário estático de exemplo
#
# Copie para `hosts.ini` (gitignored via padrão local, ver nota abaixo) e
# ajuste IPs/hostnames com os valores reais das instâncias EC2 provisionadas
# pelo Terraform (`terraform/environments/dev`). Para não versionar hosts
# reais, mantenha `hosts.example.ini` como template e crie seu próprio
# `hosts.ini` localmente (adicione `ansible/inventory/hosts.ini` ao seu
# .gitignore local se preferir não commitar).
#
# Para gerar isso automaticamente a partir dos outputs do Terraform, veja
# `dynamic_inventory.py` e o README deste diretório.

[linux_web]
web-01 ansible_host=10.0.1.10 ansible_user=ec2-user
web-02 ansible_host=10.0.1.11 ansible_user=ec2-user

[linux_db]
db-01 ansible_host=10.0.2.10 ansible_user=ec2-user

[linux_web:vars]
http_port=80

[linux_db:vars]
mysql_port=3306

# Grupo agregador usado pelo playbook site.yml para aplicar a role `base`
# (hardening/usuários/firewall) a todos os hosts Linux, independente da
# função (web/db).
[linux:children]
linux_web
linux_db

[linux:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

# Instâncias Windows (Server) ficam fora deste inventário Ansible — são
# configuradas via PowerShell (ver ../../powershell/). Este inventário cobre
# apenas os hosts Linux provisionados pelo módulo terraform/modules/compute.
