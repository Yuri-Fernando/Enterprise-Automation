; ansible.cfg — Enterprise Cloud Automation & Infrastructure Platform
;
; Configuração local para este repositório. Execute `ansible-playbook` a
; partir do diretório `ansible/` (ou defina ANSIBLE_CONFIG apontando aqui)
; para que estas opções sejam carregadas automaticamente.
;
; NOTA (Windows): ansible-playbook/ansible-lint dependem do módulo `grp`
; (POSIX-only) e não funcionam nativamente no Windows. Rode via WSL, um
; devcontainer Linux, ou deixe para o GitHub Actions (Ubuntu runner) —
; ver ansible/README.md.

[defaults]
inventory            = inventory/hosts.example.ini
roles_path           = roles
remote_tmp           = ~/.ansible/tmp
local_tmp             = ~/.ansible/tmp
retry_files_enabled  = False
host_key_checking    = False
interpreter_python   = auto_silent
stdout_callback      = yaml
callbacks_enabled    = timer, profile_tasks
forks                = 10
timeout              = 30
deprecation_warnings = True
nocows               = 1

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
pipelining          = True
control_path        = ~/.ansible/cp/%%h-%%p-%%r
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[inventory]
enable_plugins       = ini, script, yaml, auto
