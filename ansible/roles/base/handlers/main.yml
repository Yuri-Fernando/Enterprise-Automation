---
# handlers/main.yml — role: base

- name: reload ufw
  community.general.ufw:
    state: reloaded
  listen: "reload ufw"

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: "restart fail2ban"

- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: "restart sshd"

- name: restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
  listen: "restart chrony"
