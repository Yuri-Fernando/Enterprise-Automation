---
# site.yml — playbook principal
# Aplica a role `base` (hardening/usuários/firewall) a todos os hosts Linux
# e, em seguida, a role `webserver` (nginx) apenas ao grupo `linux_web`.
#
# Uso:
#   ansible-playbook -i inventory/hosts.example.ini playbooks/site.yml
#   ansible-playbook -i inventory/hosts.example.ini playbooks/site.yml --check --diff
#   ansible-playbook -i inventory/hosts.example.ini playbooks/site.yml --tags webserver

- name: Base configuration (hardening, users, firewall) — todos os hosts Linux
  hosts: linux
  become: true
  gather_facts: true
  roles:
    - role: base

- name: Web tier configuration (nginx)
  hosts: linux_web
  become: true
  gather_facts: true
  roles:
    - role: webserver
