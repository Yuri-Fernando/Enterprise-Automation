name: PowerShell Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "powershell/**"
      - ".github/workflows/powershell-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pester:
    name: Pester + PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install/Update Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0
          Import-Module Pester -MinimumVersion 5.0 -PassThru | Select-Object Name, Version

      - name: Run Pester tests (powershell/tests)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'powershell/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml

      - name: Install PSScriptAnalyzer
        if: always()
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer (powershell/)
        if: always()
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) Error-level issue(s)."
            exit 1
          }
