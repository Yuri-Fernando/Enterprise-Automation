name: Terraform CI

# Validates every Terraform change (fmt, validate, tflint) across the three
# environments, and — only when AWS credentials are configured — runs a
# read-only `terraform plan`. `terraform apply` NEVER runs from this
# workflow: applying is a deliberate, manual step the project owner runs
# locally after reviewing the plan (see docs/setup/aws-setup.md).

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------
  # fmt / init / validate — no AWS credentials required, always runs.
  # ---------------------------------------------------------------------
  validate:
    name: fmt + validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Runs once per matrix leg (cheap) but checks the whole terraform/
      # tree (modules/ + environments/) so formatting drift anywhere is
      # caught, not just in the current environment folder.
      - name: Terraform fmt (check, recursive)
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  # ---------------------------------------------------------------------
  # tflint — static analysis / best-practice linting (epic-4 scope item).
  # No AWS credentials required.
  # ---------------------------------------------------------------------
  tflint:
    name: tflint (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint plugins
        working-directory: terraform/environments/${{ matrix.environment }}
        run: tflint --init --config="${{ github.workspace }}/.tflint.hcl"

      - name: Run TFLint
        working-directory: terraform/environments/${{ matrix.environment }}
        run: tflint --config="${{ github.workspace }}/.tflint.hcl" --recursive

  # ---------------------------------------------------------------------
  # terraform plan — READ-ONLY, requires real AWS credentials via OIDC.
  # Skipped entirely (not failed) when the AWS_ROLE_TO_ASSUME secret is not
  # configured on the repository — which is the expected state until the
  # project owner sets it up (see docs/setup/github-setup.md). This job
  # never runs `terraform apply`.
  # ---------------------------------------------------------------------
  plan:
    name: terraform plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    permissions:
      id-token: write # required for AWS OIDC federation
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform plan -no-color -input=false

  # Informational job: makes it obvious in the PR checks list *why* plan
  # was skipped, instead of silently having no job appear at all.
  plan-skipped-notice:
    name: terraform plan (skipped — no AWS secret configured)
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
    steps:
      - name: Notice
        run: |
          echo "::notice::terraform plan was skipped because the AWS_ROLE_TO_ASSUME repository secret is not configured. This is expected until AWS OIDC is set up — see docs/setup/github-setup.md. fmt/validate/tflint above are unaffected."
