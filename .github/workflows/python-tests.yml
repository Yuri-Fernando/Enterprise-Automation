name: Python Tests

# NOTE: requirements.txt / requirements-dev.txt are owned by the automation
# track and may not exist in the repo yet at the time this workflow file
# was authored. That's expected — this workflow will start passing once
# those files land in main (see docs/logs/cicd-security.md).

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        run: pytest automation/tests tests/python -v --cov
